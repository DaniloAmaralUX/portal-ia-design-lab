<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#060608"><title>Mesa — skills, plugins e recursos</title><meta name="description" content="Uma mesa inspirada no macOS, com suas pastas skills, plugins e recursos."><link rel="icon" href="{{iconSkills}}"><style>{{styles}}</style></head><body>
<!-- Desktop icons: Microsoft Fluent System Icons, MIT. Palette and SVG-sheet artwork: original code-native vectors. See LICENSES.txt. -->
<div class="wallpaper" aria-hidden="true"><div id="desktop-strands" class="strands-container"><div class="strands-fallback"></div></div></div>
<main class="launchpad" aria-label="Mesa"><div class="folders" role="group" aria-label="Pastas da mesa"><button class="folder" data-folder="skills" aria-label="Explorar skills de IA" aria-describedby="folder-note-skills" title="Explorar skills de IA · clique duplo para abrir" aria-haspopup="dialog" aria-expanded="false" aria-controls="finder"><span class="folder-art" aria-hidden="true"></span><span class="folder-name">skills</span><span class="folder-note" id="folder-note-skills">Instruções para IA</span></button><button class="folder" data-folder="plugins" aria-label="Abrir plugins e integrações" aria-describedby="folder-note-plugins" title="Abrir plugins e integrações · clique duplo para abrir" aria-haspopup="dialog" aria-expanded="false" aria-controls="finder"><span class="folder-art" aria-hidden="true"></span><span class="folder-name">plugins</span><span class="folder-note" id="folder-note-plugins">Integrações dev</span></button><button class="folder" data-folder="recursos" aria-label="Explorar recursos de desenvolvimento" aria-describedby="folder-note-recursos" title="Explorar recursos de desenvolvimento · clique duplo para abrir" aria-haspopup="dialog" aria-expanded="false" aria-controls="finder"><span class="folder-art" aria-hidden="true"></span><span class="folder-name">recursos</span><span class="folder-note" id="folder-note-recursos">Arquivos e referências</span></button></div></main>
<dialog class="finder" id="finder" aria-labelledby="folder-title">
<header class="finder-titlebar"><div class="traffic-lights"><button id="close-window" class="traffic close-window" aria-label="Fechar janela"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button><button id="minimize-window" class="traffic minimize-window" aria-label="Minimizar janela"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"/></svg></button><button id="maximize-window" class="traffic maximize-window" aria-label="Ampliar janela"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 17 10-10M7 7h10v10"/></svg></button></div><div class="window-heading"><img class="location-icon" src="{{iconSkills}}" width="24" height="24" alt="" draggable="false"><h1 id="folder-title">skills</h1></div></header>
<div class="finder-toolbar" role="toolbar" aria-label="Controles do Finder"><button id="back" class="tool-button" aria-label="Voltar" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><button id="forward" class="tool-button" aria-label="Avançar" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button><div class="view-toggle"><button class="tool-button" data-view-button="grid" aria-pressed="true" aria-label="Visualizar como ícones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx=".6"/><rect x="14" y="4" width="6" height="6" rx=".6"/><rect x="4" y="14" width="6" height="6" rx=".6"/><rect x="14" y="14" width="6" height="6" rx=".6"/></svg></button><button class="tool-button" data-view-button="list" aria-pressed="false" aria-label="Visualizar como lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12M3 6h1M3 12h1M3 18h1"/></svg></button></div><label class="finder-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></svg><input id="window-search" type="search" placeholder="Buscar" aria-label="Buscar nesta pasta" autocomplete="off"></label></div>
<div class="finder-body"><aside class="finder-sidebar" aria-label="Locais"><p class="sidebar-label">Favoritos</p><div class="sidebar-folders"></div></aside><section class="finder-content" data-view="grid" aria-label="Conteúdo da pasta"><div class="finder-empty"><img class="empty-location-icon" width="80" height="80" alt="" draggable="false"><h2 id="empty-title">Esta pasta está vazia</h2><p id="folder-description"></p></div>{{libraryView}}</section></div>
<footer class="finder-status"><img class="location-icon" src="{{iconSkills}}" width="24" height="24" alt="" draggable="false"><span>Mesa</span><span class="chevron">›</span><span id="path-name">skills</span><span class="count">0 itens</span></footer>
</dialog>{{toolsView}}<div class="library-feedback" role="status" aria-live="polite"></div><script type="application/json" id="interfaces-data">{{interfacesData}}</script><script type="application/json" id="tools-data">{{toolsData}}</script><script>{{scripts}}</script></body></html>
